    <!-- GitHub Pages SPA routing: decode the path redirected via 404.html -->
    <script>
      (function () {
        var search = window.location.search;
        if (search.slice(1, 2) === 'p') {
          var decoded = decodeURIComponent(search.slice(3)).replace(/&/, '?');
          window.history.replaceState(null, null, '/' + decoded + window.location.hash);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
